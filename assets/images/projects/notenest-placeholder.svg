<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="notenest-title notenest-desc">
  <title id="notenest-title">Screenshot placeholder for NoteNest</title>
  <desc id="notenest-desc">A dark blue placeholder graphic labelled NoteNest. It is not a real screenshot.</desc>

  <defs>
    <pattern id="notenest-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#4D8DFF" stroke-opacity="0.10"/>
    </pattern>
    <radialGradient id="notenest-glow" cx="78%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#4D8DFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4D8DFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="#0E1728"/>
  <rect width="800" height="500" fill="url(#notenest-grid)"/>
  <rect width="800" height="500" fill="url(#notenest-glow)"/>

  <text x="60" y="150" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="700" fill="#4D8DFF" opacity="0.16">01</text>

  <g fill="none" stroke="#7FB0FF" stroke-width="2" opacity="0.85">
    <rect x="520" y="110" width="190" height="130" rx="14"/>
    <rect x="550" y="150" width="190" height="130" rx="14"/>
    <path d="M566 196h100M566 220h130M566 244h80" stroke-linecap="round"/>
  </g>

  <text x="60" y="330" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#E8EEF9">NoteNest</text>
  <text x="60" y="370" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="3" fill="#9BAAC2">SCREENSHOT PLACEHOLDER</text>
  <text x="60" y="398" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.5" fill="#9BAAC2" opacity="0.8">REPLACE WITH A GENUINE SCREENSHOT</text>

  <rect x="60" y="430" width="120" height="4" rx="2" fill="#4D8DFF"/>
</svg>
