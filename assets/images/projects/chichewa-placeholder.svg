    <path d="M520 130h190a16 16 0 0 1 16 16v80a16 16 0 0 1-16 16h-90l-30 28v-28h-70a16 16 0 0 1-16-16v-80a16 16 0 0 1 16-16z"/>
    <path d="M548 180h130M548 206h96" stroke-linecap="round"/>
    <circle cx="700" cy="330" r="26"/>
    <path d="M688 330l9 9 16-18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="60" y="316" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#E8EEF9">Chichewa Hate Speech</text>
  <text x="60" y="360" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#E8EEF9">Detection System</text>
  <text x="60" y="398" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="3" fill="#9BAAC2">SCREENSHOT PLACEHOLDER</text>
