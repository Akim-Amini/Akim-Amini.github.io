<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="chichewa-title chichewa-desc">
  <title id="chichewa-title">Screenshot placeholder for the Chichewa Hate Speech Detection System</title>
  <desc id="chichewa-desc">A dark blue placeholder graphic labelled Chichewa Hate Speech Detection. It is not a real screenshot.</desc>

  <defs>
    <pattern id="chichewa-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#4D8DFF" stroke-opacity="0.10"/>
    </pattern>
    <radialGradient id="chichewa-glow" cx="78%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#4D8DFF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#4D8DFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="#0E1728"/>
  <rect width="800" height="500" fill="url(#chichewa-grid)"/>
  <rect width="800" height="500" fill="url(#chichewa-glow)"/>

  <text x="60" y="150" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="700" fill="#4D8DFF" opacity="0.16">03</text>

